[project]
name = "airco-harness"
version = "0.1.0"
description = "Test harness of AI Ready Standaarden: measures whether AI-ready publication forms of a standard make agents perform better."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
dependencies = [
    "inspect-ai==0.3.281",
    "inspect-swe==0.2.71",
    "jsonschema==4.26.0",
    "lxml==6.1.3",
    "markdownify==1.2.3",
    "rdflib==7.6.0",
    "shapely==2.2.0",
]

[project.optional-dependencies]
providers = [
    "anthropic",
    "google-genai",
    "mistralai",
    "openai",
]
analysis = [
    "pandas",
    "pyarrow",
    "tabulate",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.14.3",
]

[project.scripts]
airco-sources = "validators.sources:main"
airco-refmodel = "validators.refmodel:main"
airco-matrix = "airco_harness.matrix:main"
airco-report = "airco_harness.report:main"
airco-rescore = "airco_harness.rescore:main"
airco-logcheck = "airco_harness.logcheck:main"
airco-pages = "airco_harness.pages:main"

[project.entry-points.inspect_ai]
airco_harness = "airco_harness._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airco_harness", "validators"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
