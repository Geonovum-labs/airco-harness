# Prices in dollars per million tokens, per model as named on the command line.
# Inspect prices every call with them, logs the cost per run, and stops a run at
# cost_limit. Check them against the price pages before a matrix against paid
# models, and update the date here when you change them.
#
# List prices read on 19 October 2026 from
# https://platform.claude.com/docs/en/about-claude/pricing and
# https://docs.mistral.ai/inference/pricing. A model that charges more above a
# prompt length gets the higher price, so that the cost limit never stops a run
# too late. Mistral publishes no cache-write price, so input_cache_write equals
# input. Mistral Large 4 is at its regular price, not the launch sale price.
# The local Ollama model costs nothing. Qwen3.5-27B at Kadaster gets an agreed
# GPU rate once the endpoint exists.
