# Prices in dollars per million tokens, per model as named on the command line.
# Check them against the price pages before a matrix against paid models, and
# update the date here when you change them.
#
# Prices read on 13 November 2026 from
# https://platform.claude.com/docs/en/about-claude/pricing (Anthropic) and, as
# read on 19 October 2026, https://docs.mistral.ai/inference/pricing (Mistral).
#
# Inspect gets the highest tier of a model (long_prompt when set) as its price,
# for its logged total_cost and for cost_limit, so that the limit never stops a
# run too late. The report prices every call by its own prompt length, which is
# input plus cache write plus cache read tokens: above long_prompt.above tokens
# a call pays the long_prompt rates. A cache write with a 1h TTL costs 1.6 times
# input_cache_write; Inspect logs no TTL, so the report recovers it per call from
# the cost Inspect logged.
#
# web_search is dollars per successful server-side search, counted from the
# web_search blocks in the log. It is approximate: the searches of Claude Code
# through the bridge are not always billed. Mistral web search is not priced.
#
# Mistral publishes no cache-write price, so input_cache_write equals input.
# Mistral Large 4 is at its regular price, not the launch sale price. The local
# Ollama model costs nothing. Qwen3.5-27B at Kadaster gets an agreed GPU rate
# once the endpoint exists.
