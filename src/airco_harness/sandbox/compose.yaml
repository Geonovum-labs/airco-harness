# The Docker sandbox for the agent claude-code. The same image Inspect uses by
# default, but with the network on: Inspect's own default has network_mode none,
# and Claude Code needs the web, because the standard as published is on
# docs.geostandaarden.nl. Everything the agent does on the web goes through its
# own tools and lands in the log as tool results.
services:
  default:
    image: aisiuk/inspect-tool-support
    init: true
    command: tail -f /dev/null
    network_mode: bridge
    stop_grace_period: 1s
