name: Publish measurements to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The site reads the expected outcome of a map question at the commit in its log.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --all-extras
      # Nothing is published when a log holds a key, an e-mail address or a home directory.
      - run: uv run airco-logcheck reports
      # The last build's part of each measurement; airco-pages reuses one only while its logs and the harness are unchanged.
      - uses: actions/cache@v6
        with:
          path: .site-cache
          key: site-cache-${{ github.sha }}
          restore-keys: site-cache-
      - run: uv run airco-pages --cache .site-cache
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
